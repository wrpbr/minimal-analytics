name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: node:26.9.0-bookworm@sha256:347d9d5391493c2fc3f0d161b75a9cab64a9805064b1b01b099f8ee97f98ed47
      options: --init --cpus 2 --memory 1g
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Prepare pnpm 11 global bin path
        run: echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
      - name: Bootstrap pinned Socket CLI
        run: pnpm add --global --ignore-scripts socket@1.1.162
      - name: Audit every locked dependency before installation
        run: MINIMAL_SOCKET_PATH="$(pnpm root -g)/socket" timeout -k 10s 360s node scripts/socket-audit.mts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify source and browser artifacts
        run: timeout -k 10s 300s pnpm verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ga4-${{ github.sha }}
          path: packages/ga4/dist/
          if-no-files-found: error
          retention-days: 14
